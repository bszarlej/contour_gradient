name: contour_gradient
description: >-
  A ShapeBorder and InputBorder that paint a gradient along the length of any
  OutlinedBorder shape, for containers, buttons, cards, chips and text fields.
version: 1.0.2
repository: https://github.com/bszarlej/contour_gradient
issue_tracker: https://github.com/bszarlej/contour_gradient/issues
topics:
  - gradient
  - border
  - ui
  - animation

screenshots:
  - description: 'A GIF showcasing different gradient borders'
    path: assets/showcase.gif

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
